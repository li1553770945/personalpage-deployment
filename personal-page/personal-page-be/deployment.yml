apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-page-be-deployment
spec:
  # Chat rooms are kept in-process, so this single-node installation must run
  # exactly one replica. This also keeps the personal server memory footprint low.
  replicas: 1
  selector:
    matchLabels:
      app: personal-page-be-pod
  template:
    metadata:
      labels:
        app: personal-page-be-pod
    spec:
      imagePullSecrets:
      - name: dockerhub-regcred
      - name: ccr-tencent
      containers:
      - name: personal-page-be-container
        image: ccr.ccs.tencentyun.com/littlehorse/personal-page-be:7b9822a3d04d987cd34ea9e5b2db6253dfd81f4b@sha256:06fdab528f3f5414f56e9e5b8a1dcdebd553d35e0e796fd9deedc90eb4a40384
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: OTEL_SERVICE_NAME
          value: personal-page-be
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: otelcol-service.default.svc.cluster.local:4317
        - name: AICHAT_TRUST_PROXY_HEADERS
          value: "true"
        - name: PERSONAL_PAGE_JWT_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-key-secret
              key: JWT_KEY
        volumeMounts:
        - name: config-volume
          mountPath: /app/conf
          readOnly: true
        ports:
        - containerPort: 9101
        livenessProbe:
          httpGet:
            path: /api/ping
            port: 9101
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ping
            port: 9101
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config-volume
        configMap:
          name: personal-page-be-config
