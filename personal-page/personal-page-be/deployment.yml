apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-page-be-deployment
spec:
  # Chat rooms are kept in-process, so this single-node installation must run
  # exactly one replica. This also keeps the personal server memory footprint low.
  replicas: 1
  selector:
    matchLabels:
      app: personal-page-be-pod
  template:
    metadata:
      labels:
        app: personal-page-be-pod
    spec:
      imagePullSecrets:
      - name: dockerhub-regcred
      - name: ccr-tencent
      containers:
      - name: personal-page-be-container
        image: ccr.ccs.tencentyun.com/littlehorse/personal-page-be:e9465712163b1f747236db165f0a208d9af26457@sha256:2aa8a64ab23e225ee7aea4da13cf64338a2b8df2eff741adb453d064e154142d
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: OTEL_SERVICE_NAME
          value: personal-page-be
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: otelcol-service.default.svc.cluster.local:4317
        - name: AICHAT_TRUST_PROXY_HEADERS
          value: "true"
        - name: PERSONAL_PAGE_JWT_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-key-secret
              key: JWT_KEY
        volumeMounts:
        - name: config-volume
          mountPath: /app/conf
          readOnly: true
        ports:
        - containerPort: 9101
        livenessProbe:
          httpGet:
            path: /api/ping
            port: 9101
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ping
            port: 9101
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config-volume
        configMap:
          name: personal-page-be-config
